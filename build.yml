name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Работает и без gradlew в репозитории; если закоммитите wrapper, gradle-version можно убрать
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: vlo-school
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
